<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kisan Sahayak</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: #f4f1e8;
      color: #1f2a1f;
    }
    main {
      max-width: 36rem;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
    }
    h1 { font-size: 2rem; margin-bottom: 0.25rem; }
    p { line-height: 1.45; }
    label { display: block; margin-top: 1.5rem; font-size: 0.95rem; }
    input {
      width: 100%;
      box-sizing: border-box;
      margin-top: 0.4rem;
      padding: 0.75rem 0.8rem;
      font-size: 1.1rem;
      border: 1px solid #b7b09a;
      background: white;
    }
    button {
      margin-top: 1rem;
      padding: 0.75rem 1.1rem;
      font-size: 1rem;
      background: #215c3a;
      color: white;
      border: 0;
      cursor: pointer;
    }
    button[disabled] { opacity: 0.6; cursor: wait; }
    #status { min-height: 1.4rem; margin-top: 1rem; }
  </style>
</head>
<body>
  <main>
    <h1>Kisan Sahayak</h1>
    <p>Talk to the agent with the same phone number you will use on the real line. Call once, ask a question, hang up, then call again. The second call should mention the first.</p>
    <label for="phone">Mobile number
      <input id="phone" inputmode="tel" placeholder="98xxxxxxxx" autocomplete="tel" />
    </label>
    <button id="call" type="button">Start call</button>
    <button id="hangup" type="button" hidden>Hang up</button>
    <p id="status">Idle.</p>
  </main>
  <script type="module">
    import { Room, RoomEvent } from "https://cdn.jsdelivr.net/npm/livekit-client@2.15.7/+esm";

    const phoneInput = document.querySelector("#phone");
    const callButton = document.querySelector("#call");
    const hangupButton = document.querySelector("#hangup");
    const status = document.querySelector("#status");
    let room = null;

    function setStatus(text) { status.textContent = text; }

    callButton.addEventListener("click", async () => {
      callButton.disabled = true;
      setStatus("Connecting…");
      try {
        const response = await fetch("/token?phone=" + encodeURIComponent(phoneInput.value));
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || "Could not start the call");
        room = new Room();
        room.on(RoomEvent.Disconnected, () => {
          setStatus("Call ended. The summary is written when the agent shuts down. Call again with the same number.");
          hangupButton.hidden = true;
          callButton.hidden = false;
          callButton.disabled = false;
        });
        await room.connect(payload.url, payload.token);
        await room.localParticipant.setMicrophoneEnabled(true);
        setStatus("Connected as " + payload.phone + ". Ask about a mandi price or harvest, then hang up.");
        callButton.hidden = true;
        hangupButton.hidden = false;
      } catch (error) {
        setStatus(error.message);
        callButton.disabled = false;
      }
    });

    hangupButton.addEventListener("click", async () => {
      hangupButton.disabled = true;
      if (room) await room.disconnect();
      hangupButton.disabled = false;
    });
  </script>
</body>
</html>
